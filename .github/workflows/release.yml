name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# One job per platform rather than a matrix, so each can read its OWN certificate secrets —
# GitHub does not support dynamic secret lookup (secrets[matrix.name]), so the mac and windows
# jobs cannot share one generic CSC_LINK name if their certificates differ.
#
# Signing activates by itself the moment the secrets exist: each job materializes a presence flag
# at job level (job-level env CAN read secrets; step `if` cannot), then takes the signed path with
# its signing env applied ONLY on that step when the flag is true, and the unsigned path otherwise.
# CSC_LINK must never be defined-but-empty: electron-builder's own getCscLink() deliberately treats
# an empty CSC_LINK as a provided certificate path ("allow to specify as empty string") and then
# fails trying to open it — which is what broke the first version of this workflow on macOS and
# Windows while Linux (which ignores CSC_LINK) passed.
jobs:
  mac:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAC_SIGNING_READY: ${{ secrets.MAC_CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - run: npm run build

      # Signed + notarized: needs a Developer ID Application certificate (base64 .p12) and the
      # Apple ID app-specific password + team id, so Gatekeeper lets users open the app and
      # electron-updater can actually apply updates on macOS.
      - name: Package and publish (signed + notarized)
        if: env.MAC_SIGNING_READY == 'true'
        run: npx electron-builder --publish always
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package and publish (unsigned)
        if: env.MAC_SIGNING_READY != 'true'
        run: npx electron-builder --publish always

  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WIN_SIGNING_READY: ${{ secrets.WIN_CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - run: npm run build

      # Signed: needs a Windows code-signing certificate (base64 .pfx), so SmartScreen stops
      # warning on first download.
      - name: Package and publish (signed)
        if: env.WIN_SIGNING_READY == 'true'
        run: npx electron-builder --publish always
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Package and publish (unsigned)
        if: env.WIN_SIGNING_READY != 'true'
        run: npx electron-builder --publish always

  # Runs only after all three platform builds have published, then fills the release's own body
  # from the same notes the update feeds carry (scripts/extract-release-notes.mjs). electron-builder
  # writes releaseNotes into the feed but leaves the release description empty, so the page a user
  # actually reads needed this extra step. gh is preinstalled on GitHub-hosted runners; no
  # npm install is needed since the script only touches Node's own fs/path/url modules.
  notes:
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: node scripts/extract-release-notes.mjs

      - run: gh release edit "${GITHUB_REF_NAME}" --notes-file build/release-notes.md

  linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - run: npm run build

      # Linux packages aren't code-signed in this pipeline — the AppImage carries no signature
      # authority story the way macOS/Windows do.
      - name: Package and publish
        run: npx electron-builder --publish always
